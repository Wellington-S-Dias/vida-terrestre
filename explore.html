<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./images/Arara-Azul(Logo-Principal).png">
    <link rel="stylesheet" href="./css/explore.css">
    <link rel="stylesheet" href="./css/header.css">
    <title>Vida Terrestre - Explorar</title>
</head>

<body>
    <header class="header">
        <div class="header-logo"><img src="./images/Arara-Azul(Logo-Principal).png" alt="Logotipo Vida Terrestre"></div>

        <nav class="nav-menu">
            <a href="index.html">Início</a>

            <a href="login.html"><span style="cursor: pointer; text-decoration: none; font-weight: 2em;"><b>Entrar</b></span></a>

        </nav>
    </header>

    <video id="video-bg-1" class="video-bg active" autoplay muted loop playsinline preload="auto"><source src="https://res.cloudinary.com/z0jjyefk/video/upload/v1790189126/amazonia.mp4" type="video/mp4"></video>

    <video id="video-bg-2" class="video-bg" autoplay muted loop playsinline preload="none"></video>

    <main class="main-content">
    <div class="input-area">
        <h1>Explorar Espécies da Fauna Brasileira</h1>
        <p>Descubra e aprenda sobre as diversas espécies que habitam o território brasileiro.</p>
    </div>

    <div class="input-filter">
        <div class="search-box">
            <img src="./images/icons/lupa.png" alt="Ícone de busca" class="search-icon">
            <input type="search" id="search-input" placeholder="Buscar espécie por nome...">
        </div>
            <button id="btn-filtros" class="btn-filtros">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                Filtros <span id="contador-filtros" class="badge-contador"></span>
            </button>
    </div>

    <!-- Overlay de fundo -->
    <div id="filter-overlay" class="filter-overlay"></div>
<!-- Painel Lateral (Drawer) -->
        <aside id="filter-drawer" class="filter-drawer">
            <div class="drawer-header">
                <h2>Filtros Avançados</h2>
                <button id="btn-fechar" class="btn-fechar">&times;</button>
            </div>
    <div class="drawer-body">
    <!-- Região -->
        <div class="filtro-grupo">
            <label class="filtro-titulo">Região</label>
            <select id="filtro-regiao" class="select-dark">
                <option value="todas">Todas as Regiões</option>
                <option value="norte">Norte</option>
                <option value="nordeste">Nordeste</option>
                <option value="centro-oeste">Centro-Oeste</option>
                <option value="sudeste">Sudeste</option>
                <option value="sul">Sul</option>
            </select>
        </div>
    <!-- Classe do Animal -->
        <div class="filtro-grupo">
            <label class="filtro-titulo">Classe do Animal</label>
            <select id="filtro-classe" class="select-dark">
                <option value="todos">Todos os Tipos</option>
                <option value="mamifero">Mamífero</option>
                <option value="ave">Ave</option>
                <option value="anfibio">Anfíbio</option>
                <option value="reptil">Réptil</option>
            </select>
        </div>
    <!-- Status de Conservação -->
        <div class="filtro-grupo">
            <label class="filtro-titulo">Status de Conservação</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="status" value="todos" checked> Todos os Status</label>
                <label class="radio-label"><input type="radio" name="status" value="pouco-preocupante"> Pouco Preocupante</label>
                <label class="radio-label"><input type="radio" name="status" value="quase-ameacados"> Quase Ameaçados</label>
                <label class="radio-label"><input type="radio" name="status" value="vulneravel"> Vulnerável</label>
                <label class="radio-label"><input type="radio" name="status" value="em-perigo"> Em Perigo</label>
                <label class="radio-label"><input type="radio" name="status" value="critico"> Críticamente em perigo</label>
            </div>
        </div>
    </div>

            <div class="drawer-footer">
                <button id="btn-limpar" class="btn-secundario">Limpar</button>
                <button id="btn-aplicar" class="btn-principal">Aplicar Filtros</button>
            </div>
        </aside>

        <div class="biome-buttons">
            <button class="biome-btn" data-biome="todos" data-logo="./images/Arara-Azul(Logo-Principal).png" data-video="https://res.cloudinary.com/z0jjyefk/video/upload/v1790189126/amazonia.mp4"><svg class="biome-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> Todos</button>

            <button class="biome-btn" data-biome="amazonia" data-logo="./images/Onça-Pintada (Amazônia).png" data-video="./vids/amazonia.mp4"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.4 19 2c1 2 2 4.1 2 9 0 4.9-4 9-10 9z"/><path d="M11 20v-8"/></svg> Amazônia</button>

            <button class="biome-btn" data-biome="cerrado" data-logo="./images/Tamanduá-Bandeira(Cerrado).png" data-video="./vids/cerrado.webm"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-5"/><path d="M12 16L8 12"/><path d="M12 14l4-3"/><circle cx="7" cy="11" r="3"/><circle cx="16" cy="10" r="4"/><circle cx="11" cy="7" r="4"/></svg> Cerrado</button>

            <button class="biome-btn" data-biome="caatinga" data-logo="./images/Lobo-Guara(Caatinga).png" data-video="./vids/caatinga.webm"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M7 8v4a2 2 0 0 0 2 2h3"/><path d="M17 10v3a2 2 0 0 1-2 2h-3"/></svg> Caatinga</button>

            <button class="biome-btn" data-biome="mata-atlantica" data-logo="./images/Mico-Leão-Dourado(Mata Atlântica).png" data-video="./vids/mata-atl.mp4"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/><path d="M12 13v8"/></svg> Mata Atlântica</button>

            <button class="biome-btn" data-biome="pantanal" data-logo="./images/Tuiuiú(Pantanal).png" data-video="./vids/pantanal.webm"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="11" rx="9" ry="5"/><path d="M12 11l6-4"/><path d="M2 17c4 2 8 2 10 0s6-2 10 0"/></svg> Pantanal</button>

            <button class="biome-btn" data-biome="pampa" data-logo="./images/Veado-Campeiro (Pampa).png" data-video="./vids/pampa.mp4"><svg class="biome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15c5-2 7 1 11-3s7-1 9 1"/><path d="M4 22h16"/></svg> Pampa</button>
        </div>

        <div id="cards-container" class="animal-cards"></div>
    </main>

    <div id="animal-modal" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>

            <div class="modal-image-container"><img id="modal-image" src="" alt="Fotografia do animal selecionado"></div>

            <section class="modal-info">
                <h1 id="modal-title">Nome da Espécie</h1>

                <p id="modal-scientific" class="scientific-name">Nome Científico</p>

                <span id="modal-status" class="status-badge"></span>

                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="info">Informações</button>

                    <button class="tab-btn" data-tab="distribution">Distribuição</button>

                    <button class="tab-btn" data-tab="threats">Ameaças</button>
                </div>

                <div class="tab-content">
                    <div class="tab-pane active" id="tab-info">
                        <div class="info-item">
                            <h3>Habitat</h3>

                            <p id="modal-habitat"></p>
                        </div>

                        <div class="info-item">
                            <h3>Comportamento</h3>

                            <p id="modal-behavior"></p>
                        </div>

                        <div class="info-item">
                            <h3>Alimentação</h3>

                            <p id="modal-diet"></p>
                        </div>
                    </div>

                    <div class="tab-pane" id="tab-distribution">
                        <div class="info-item">
                            <h3>Distribuição Geográfica</h3>

                            <p id="modal-biome"></p>
                        </div>
                    </div>

                    <div class="tab-pane" id="tab-threats">
                        <div class="info-item">
                            <h3>Principais Ameaças</h3>

                            <p id="modal-threats"></p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="./js/biome-shift.js"></script>
    <script src="./js/animals.js"></script>
    <script src="./js/modal.js"></script>
    
</body>
</html>
