<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Css/styleSistemaDeLogin.css">
</head>
<body>
    <div class="login-container">
        <h1>Bem Vindo</h1>
        <form action="/login" id="formLogin">
            <div class="input-group">
                <label for="user">Usuário: </label>
                <input type="text" name="user" id="user" placeholder="Digite se usuário" required>
            </div>
            <div class="input-group">
                <label for="password">Senha: </label>
                <input type="password" name="password" id="password" placeholder="Digite sua senha" required>
            </div>
            <button type="submit">Entrar</button>
            <p class="link-cadastro">
                Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </p>
        </form>
    </div>
    <script src="JS/menuLogin.js"></script>
</body>
</html>
